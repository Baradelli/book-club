<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1011" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Clube do Livro</title>
    <!--
      TEMA ANTES DA PRIMEIRA PINTURA (decisão F da Tarefa 12, regra 27).

      Síncrono, inline e sem `src`, de propósito: `defer`, `async` ou um
      `<link rel="stylesheet">` na frente fariam isto rodar DEPOIS da primeira
      pintura, e o flash branco volta. A chave 'clube.theme' é a mesma de
      `src/theme.ts`. Quem acusa é `src/__tests__/index-html.test.ts`, e é lá
      que mora o porquê por extenso — esta é a casca do PWA, que todo visitante
      baixa, não lugar de argumento.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('clube.theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* Armazenamento bloqueado: fica o tema do sistema. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
