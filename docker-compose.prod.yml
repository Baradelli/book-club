# Postgres de PRODUÇÃO (servidor `devocional`). Diferenças vs docker-compose.yml
# (dev): senha vem do ambiente (nunca no arquivo), porta presa no loopback
# (127.0.0.1) para não expor o banco na internet, e nome/volume próprios.
#
# Subir (no servidor, em /var/www/vitor/clube-do-livro):
#   POSTGRES_PASSWORD='...' docker compose -f docker-compose.prod.yml up -d
# Ver docs/DEPLOY.md.
#
# ⚠️ `name: clube` fixa o projeto (e portanto o volume `clube_clube_pgdata_prod`).
# Sem ele o nome viria da pasta, e um `up` de outro diretório criaria um banco
# NOVO e vazio ao lado do de produção.
name: clube
services:
  db:
    image: postgres:16-alpine
    container_name: clube_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: clube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: clube
    ports:
      - '127.0.0.1:5436:5432'
    volumes:
      - clube_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U clube -d clube']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clube_pgdata_prod:
