# nginx — Clube do Livro em produção (servidor `devocional`).
# Cópia versionada do que mora em /etc/nginx/sites-available/. Alterou aqui?
# Copie para o servidor, `nginx -t` e `systemctl reload nginx`. Ver docs/DEPLOY.md.
#
# DNS no Cloudflare (proxy laranja); certificado Let's Encrypt por DNS-01
# (certbot --dns-cloudflare), renovado pelo timer do certbot.
server {
    listen 80;
    listen [::]:80;
    server_name clubelivro.vitorbaradelli.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name clubelivro.vitorbaradelli.com;

    ssl_certificate     /etc/letsencrypt/live/clubelivro.vitorbaradelli.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clubelivro.vitorbaradelli.com/privkey.pem;

    client_max_body_size 10m;
    root /var/www/vitor/clube-do-livro-web;
    index index.html;

    # API -> Fastify na 3030. O prefixo /api/ é removido no proxy
    # (o front usa DEFAULT_API_URL = '/api', packages/app/src/env.ts).
    location /api/ {
        proxy_pass http://127.0.0.1:3030/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Capas dos livros, hospedadas aqui (link de loja quebra). Pasta FORA do
    # root do PWA de propósito: o rsync --delete do deploy apagaria o que
    # estivesse lá dentro.
    location /covers/ {
        alias /var/www/vitor/clube-do-livro-covers/;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # PWA (SPA) na raiz
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Service worker, handler de push, manifesto e HTML sempre revalidados
    # (um SW velho preso em cache é pior que nenhum).
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /push-handler.js { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # Assets com hash: cache longo
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
}
